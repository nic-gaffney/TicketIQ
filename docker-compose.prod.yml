# TLS is terminated by Cloudflare; nginx only needs to listen on port 80.
services:
  db:
    ports: []
    restart: always

  backend:
    build:
      target: production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes: []
    ports: []
    restart: always

  frontend:
    build:
      target: production
    volumes: []
    ports: []
    restart: always

  nginx:
    profiles: []
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
